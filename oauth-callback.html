<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OAuth callback — One Ear Up Publisher</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 640px; margin: 48px auto; padding: 0 16px; line-height: 1.6; color: #222; }
  h1 { font-size: 1.3rem; }
  code { display: block; background: #f4f4f4; padding: 12px; border-radius: 6px; word-break: break-all; margin: 12px 0; }
  .label { font-weight: 600; margin-top: 1.5rem; }
  button { padding: 8px 14px; font-size: 0.95rem; cursor: pointer; }
</style>
</head>
<body>
<h1>Authorization complete</h1>
<p>Copy the value below and send it back — nothing on this page is transmitted anywhere.</p>

<div class="label">code</div>
<code id="code">(none found in URL)</code>
<button onclick="copyIt('code')">Copy code</button>

<div class="label">state</div>
<code id="state">(none found in URL)</code>

<div class="label">error (if any)</div>
<code id="error">(none)</code>

<script>
  const params = new URLSearchParams(window.location.search);
  document.getElementById("code").textContent = params.get("code") || "(none found in URL)";
  document.getElementById("state").textContent = params.get("state") || "(none found in URL)";
  document.getElementById("error").textContent =
    params.get("error") ? (params.get("error") + ": " + (params.get("error_description") || "")) : "(none)";

  function copyIt(id) {
    const text = document.getElementById(id).textContent;
    navigator.clipboard.writeText(text).catch(() => {});
  }
</script>
</body>
</html>
